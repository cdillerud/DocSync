name: Apply AP Posted Metadata Completion Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - 'backend/scripts/apply_ap_posted_metadata_completion_patch.py'
      - '.github/workflows/apply-ap-posted-metadata-completion-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0
      - run: python backend/scripts/apply_ap_posted_metadata_completion_patch.py
      - name: Verify intended file only
        run: test "$(git diff --name-only)" = 'backend/services/ap_auto_post_service.py'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/services/ap_auto_post_service.py
          git commit -m 'parity: require SharePoint metadata sync after AP post'
          git push origin HEAD:feature/square9-parity-systemid-gate
