name: Apply AP Unlink SystemId Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - 'backend/scripts/apply_ap_unlink_systemid_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0
      - run: python backend/scripts/apply_ap_unlink_systemid_patch.py
      - name: Verify intended files only
        run: |
          files="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/square9-ap-factbox-systemid-gate.yml' '.github/workflows/square9-parity-gate.yml' 'backend/routers/gpi_integration.py' | sort)"
          test "$files" = "$expected"
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/routers/gpi_integration.py .github/workflows/square9-parity-gate.yml .github/workflows/square9-ap-factbox-systemid-gate.yml
          git commit -m 'parity: bind AP unlink to BC SystemId'
          git push origin HEAD:feature/square9-parity-systemid-gate
