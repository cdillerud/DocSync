name: Apply AP Unlink SystemId Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - 'backend/scripts/apply_ap_unlink_systemid_patch.py'
      - '.github/workflows/apply-ap-unlink-systemid-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0
      - run: python backend/scripts/apply_ap_unlink_systemid_patch.py
      - name: Verify intended file only
        run: test "$(git diff --name-only)" = 'backend/routers/gpi_integration.py'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/routers/gpi_integration.py
          git commit -m 'parity: bind AP unlink route to BC SystemId'
          git push origin HEAD:feature/square9-parity-systemid-gate
