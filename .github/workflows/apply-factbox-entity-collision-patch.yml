name: Apply FactBox Entity Collision Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - '.github/workflows/apply-factbox-entity-collision-patch.yml'
      - 'backend/scripts/apply_factbox_entity_collision_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0

      - name: Apply exact entity collision patch
        run: python backend/scripts/apply_factbox_entity_collision_patch.py

      - name: Verify only intended production file changed
        run: |
          git diff --exit-code -- .github/workflows/apply-factbox-entity-collision-patch.yml backend/scripts/apply_factbox_entity_collision_patch.py
          changed="$(git diff --name-only)"
          test "$changed" = "backend/routers/gpi_integration.py" || {
            echo "::error::Unexpected changed files: $changed"
            exit 1
          }

      - name: Commit entity-safe FactBox lookups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/routers/gpi_integration.py
          git commit -m "parity: bind Gamer Documents lookups to BC entity"
          git push origin HEAD:feature/square9-parity-systemid-gate
