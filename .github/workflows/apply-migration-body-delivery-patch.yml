name: Apply Historical Migration Body Delivery Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - '.github/workflows/apply-migration-body-delivery-patch.yml'
      - 'backend/scripts/apply_migration_body_delivery_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0

      - name: Apply exact historical body delivery patch
        run: python backend/scripts/apply_migration_body_delivery_patch.py

      - name: Verify only intended production files changed
        run: |
          git diff --exit-code -- .github/workflows/apply-migration-body-delivery-patch.yml backend/scripts/apply_migration_body_delivery_patch.py
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' backend/services/migration/job.py backend/services/migration/sources.py backend/services/sharepoint_service.py | sort)"
          test "$changed" = "$expected" || {
            echo "::error::Unexpected changed files: $changed"
            exit 1
          }

      - name: Commit historical document-body delivery integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/services/migration/job.py backend/services/migration/sources.py backend/services/sharepoint_service.py
          git commit -m "parity: deliver historical document bodies through SharePoint"
          git push origin HEAD:feature/square9-parity-systemid-gate
