name: Apply Historical Migration Parity Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - '.github/workflows/apply-migration-parity-identity-patch.yml'
      - 'backend/scripts/apply_migration_parity_identity_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0

      - name: Apply exact migration parity patch
        run: python backend/scripts/apply_migration_parity_identity_patch.py

      - name: Verify only intended production file changed
        run: |
          git diff --exit-code -- .github/workflows/apply-migration-parity-identity-patch.yml backend/scripts/apply_migration_parity_identity_patch.py
          changed="$(git diff --name-only)"
          test "$changed" = "backend/services/migration/job.py" || {
            echo "::error::Unexpected changed files: $changed"
            exit 1
          }

      - name: Commit historical migration parity gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/services/migration/job.py
          git commit -m "parity: gate historical migration on BC SystemId"
          git push origin HEAD:feature/square9-parity-systemid-gate
