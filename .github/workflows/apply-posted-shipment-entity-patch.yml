name: Apply Posted Shipment Entity Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - '.github/workflows/apply-posted-shipment-entity-patch.yml'
      - 'backend/scripts/apply_posted_shipment_entity_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0

      - name: Apply exact Posted Sales Shipment mapping patch
        run: python backend/scripts/apply_posted_shipment_entity_patch.py

      - name: Verify only AL codeunit changed
        run: |
          git diff --exit-code -- .github/workflows/apply-posted-shipment-entity-patch.yml backend/scripts/apply_posted_shipment_entity_patch.py
          changed="$(git diff --name-only)"
          test "$changed" = "bc-extension/src/codeunit/GPIDocumentLinkMgt.Codeunit.al" || {
            echo "::error::Unexpected changed files: $changed"
            exit 1
          }

      - name: Commit Posted Sales Shipment entity mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bc-extension/src/codeunit/GPIDocumentLinkMgt.Codeunit.al
          git commit -m "parity: map posted shipments to Hub visibility entity"
          git push origin HEAD:feature/square9-parity-systemid-gate
