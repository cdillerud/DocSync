name: Apply Split Mailbox Provenance Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - 'backend/scripts/apply_split_mailbox_provenance_patch.py'
      - '.github/workflows/apply-split-mailbox-provenance-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0
      - run: python backend/scripts/apply_split_mailbox_provenance_patch.py
      - name: Verify intended file only
        run: test "$(git diff --name-only)" = 'backend/services/batch_po_splitter.py'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/services/batch_po_splitter.py
          git commit -m 'parity: preserve mailbox provenance through splits'
          git push origin HEAD:feature/square9-parity-systemid-gate
