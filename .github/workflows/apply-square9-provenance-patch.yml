name: Apply Square9 Provenance Patch

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - '.github/workflows/apply-square9-provenance-patch.yml'
      - 'backend/scripts/apply_square9_mailbox_provenance_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/square9-parity-systemid-gate
          fetch-depth: 0

      - name: Apply exact provenance patch
        run: python backend/scripts/apply_square9_mailbox_provenance_patch.py

      - name: Verify only intended production file changed
        run: |
          git diff --exit-code -- .github/workflows/apply-square9-provenance-patch.yml backend/scripts/apply_square9_mailbox_provenance_patch.py
          changed="$(git diff --name-only)"
          test "$changed" = "backend/services/email_polling_service.py" || {
            echo "::error::Unexpected changed files: $changed"
            exit 1
          }

      - name: Commit provenance wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/services/email_polling_service.py
          git commit -m "parity: persist authoritative mailbox provenance"
          git push origin HEAD:feature/square9-parity-systemid-gate
