name: Square9 AP FactBox SystemId Gate

on:
  pull_request:
    paths:
      - 'backend/services/document_link_visibility_service.py'
      - 'backend/routers/gpi_integration.py'
      - 'backend/tests/test_document_link_systemid_visibility.py'
      - 'bc-extension/src/Page50100.GPIDocumentLinkFactbox.al'
      - 'bc-extension/src/PageExt50100.GPIPurchInvoiceExt.al'
      - 'bc-extension/src/PageExt50101.GPIPostedPurchInvExt.al'
      - '.github/workflows/square9-ap-factbox-systemid-gate.yml'
  workflow_dispatch:

jobs:
  ap-factbox-systemid:
    name: AP FactBox immutable record identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run immutable identity selector tests
        working-directory: backend
        run: pytest -q tests/test_document_link_systemid_visibility.py

      - name: Guardrail - Hub visibility binds immutable SystemId when supplied
        run: |
          grep -q 'GPI_SourceSystemId' backend/services/document_link_visibility_service.py || {
            echo "::error::Hub FactBox selector does not include normalized SourceSystemId"
            exit 1
          }
          grep -q 'bc_record_id' backend/services/document_link_visibility_service.py || {
            echo "::error::Hub FactBox selector does not include top-level BC record identity"
            exit 1
          }
          grep -q 'targetSystemId eq' backend/services/document_link_visibility_service.py || {
            echo "::error::BC documentLinks selector does not bind targetSystemId"
            exit 1
          }
          grep -q 'UUID(raw)' backend/services/document_link_visibility_service.py || {
            echo "::error::FactBox SystemId is not validated as a GUID"
            exit 1
          }

      - name: Guardrail - backend routes carry SystemId end to end
        run: |
          grep -q 'identity_query = f"?bc_system_id={bc_system_id}"' backend/routers/gpi_integration.py || {
            echo "::error::FactBox browser UI drops BC SystemId"
            exit 1
          }
          grep -q 'const LIST_API = API + "{identity_query}"' backend/routers/gpi_integration.py || {
            echo "::error::FactBox iframe list read is not identity-bound"
            exit 1
          }
          grep -q 'build_hub_document_link_query(bc_entity, bc_document_no, bc_system_id)' backend/routers/gpi_integration.py || {
            echo "::error::Hub document selector does not receive BC SystemId"
            exit 1
          }
          grep -q 'bc_entity, bc_document_no, bc_system_id' backend/routers/gpi_integration.py || {
            echo "::error::BC documentLinks read does not receive BC SystemId"
            exit 1
          }
          grep -q 'build_folder_match_query(bc_entity, bc_document_no, bc_system_id)' backend/routers/gpi_integration.py || {
            echo "::error::BC Drop folder reuse is not bound to resolved BC SystemId"
            exit 1
          }

      - name: Guardrail - AP BC pages pass Rec.SystemId
        run: |
          grep -q 'Rec.SystemId' bc-extension/src/PageExt50100.GPIPurchInvoiceExt.al || {
            echo "::error::Purchase Invoice FactBox does not receive draft SystemId"
            exit 1
          }
          grep -q 'Rec.SystemId' bc-extension/src/PageExt50101.GPIPostedPurchInvExt.al || {
            echo "::error::Posted Purchase Invoice FactBox does not receive posted SystemId"
            exit 1
          }
          grep -q 'CurrentBCSystemId: Guid' bc-extension/src/Page50100.GPIDocumentLinkFactbox.al || {
            echo "::error::FactBox does not retain immutable BC record identity"
            exit 1
          }
          grep -q "'?bc_system_id='" bc-extension/src/Page50100.GPIDocumentLinkFactbox.al || {
            echo "::error::FactBox HTTP reads do not transmit BC SystemId"
            exit 1
          }

      - name: Guardrail - upload resolves identity before SharePoint artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('backend/routers/gpi_integration.py').read_text(encoding='utf-8')
          start = text.index('async def upload_document_to_bc_record(')
          block = text[start:text.index('# --- CREATE GPI DOCUMENT LINK IN BC ---', start)]
          identity = block.index('resolve_bc_document_system_id')
          upload = block.index('upload_to_sharepoint')
          if not identity < upload:
              raise SystemExit('BC SystemId resolution must occur before SharePoint upload')
          if 'build_folder_match_query(bc_entity, bc_document_no, bc_system_id)' not in block:
              raise SystemExit('folder reuse must bind resolved BC SystemId')
          PY

      - name: Guardrail - Sales write lane remains disabled
        run: |
          grep -q 'BC_SALES_LINK_WRITE_ENABLED.*false' backend/services/bc_link_service.py || {
            echo "::error::Sales BC attachment write lane is not default-off"
            exit 1
          }
