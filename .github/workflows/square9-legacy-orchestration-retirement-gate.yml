name: Square9 Legacy Orchestration Retirement Gate

on:
  push:
    branches:
      - feature/square9-parity-systemid-gate
    paths:
      - 'backend/services/document_orchestration_service.py'
      - 'backend/services/document_retry_service.py'
      - 'backend/tests/test_legacy_document_orchestration_retired.py'
      - '.github/workflows/square9-legacy-orchestration-retirement-gate.yml'
  pull_request:
    paths:
      - 'backend/services/document_orchestration_service.py'
      - 'backend/services/document_retry_service.py'
      - 'backend/tests/test_legacy_document_orchestration_retired.py'
      - '.github/workflows/square9-legacy-orchestration-retirement-gate.yml'
  workflow_dispatch:

jobs:
  retired-bypass:
    name: Legacy delivery bypass remains fail-closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
      - name: Prove retired function fails closed
        working-directory: backend
        run: pytest -q tests/test_legacy_document_orchestration_retired.py
      - name: Guardrail - retired service contains no delivery side effects
        run: |
          if grep -nE 'upload_to_sharepoint|create_sharing_link|get_bc_sales_orders|link_document_to_bc|get_db\(' backend/services/document_orchestration_service.py; then
            echo "::error::Retired orchestration regained an executable delivery dependency"
            exit 1
          fi
      - name: Guardrail - retry cannot call retired orchestration
        run: |
          if grep -n 'run_upload_and_link_workflow' backend/services/document_retry_service.py; then
            echo "::error::Retry path calls retired upload/link orchestration"
            exit 1
          fi
