name: Square9 Parity Gate

on:
  pull_request:
    paths:
      - 'backend/routers/gpi_integration.py'
      - 'backend/services/sharepoint_service.py'
      - 'backend/services/bc_link_service.py'
      - 'backend/services/document_link_service.py'
      - 'backend/services/document_link_visibility_service.py'
      - 'backend/services/document_orchestration_service.py'
      - 'backend/services/document_bytes_intake_service.py'
      - 'backend/services/email_polling_service.py'
      - 'backend/services/mailbox_provenance_service.py'
      - 'backend/services/batch_po_splitter.py'
      - 'backend/services/document_retry_service.py'
      - 'backend/services/document_reprocess_service.py'
      - 'backend/tests/test_square9_parity_metadata.py'
      - 'backend/tests/test_bc_link_write_boundary.py'
      - 'backend/tests/test_document_link_entity_guard.py'
      - 'backend/tests/test_document_link_visibility_service.py'
      - 'backend/tests/test_mailbox_provenance_service.py'
      - 'bc-extension/src/codeunit/GPIDocumentLinkMgt.Codeunit.al'
      - 'bc-extension/src/Page50100.GPIDocumentLinkFactbox.al'
      - 'bc-extension/src/PageExt50100.GPIPurchInvoiceExt.al'
      - 'bc-extension/src/PageExt50101.GPIPostedPurchInvExt.al'
      - 'bc-extension/src/PageExt50104.GPIPurchOrderExt.al'
      - '.github/workflows/square9-parity-gate.yml'
  workflow_dispatch:

jobs:
  parity-tests:
    name: AP/Warehouse parity safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx python-dotenv fastapi motor

      - name: Run focused parity tests
        working-directory: backend
        env:
          DEMO_MODE: 'true'
          BC_BLOCK_PRODUCTION_WRITES: 'true'
          BC_READ_ENVIRONMENT: 'Production'
          BC_WRITE_ENVIRONMENT: 'Sandbox_NoZetadocs_UAT'
          BC_SALES_LINK_WRITE_ENABLED: 'false'
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: gpi_hub_ci
          UPLOAD_DIR: /tmp/gpi-hub-ci-uploads
        run: |
          pytest -q \
            tests/test_square9_parity_metadata.py \
            tests/test_bc_link_write_boundary.py \
            tests/test_document_link_entity_guard.py \
            tests/test_document_link_visibility_service.py \
            tests/test_mailbox_provenance_service.py

      - name: Guardrail - no generic BC_ENVIRONMENT attachment writes
        run: |
          if grep -n "BC_ENVIRONMENT.*documentAttachments\|documentAttachments.*BC_ENVIRONMENT" backend/services/bc_link_service.py; then
            echo "::error::BC attachment write path references generic BC_ENVIRONMENT"
            exit 1
          fi

      - name: Guardrail - Sales BC attachment writes default off
        run: |
          grep -q 'BC_SALES_LINK_WRITE_ENABLED.*false' backend/services/bc_link_service.py || {
            echo "::error::Sales BC attachment write lane is not default-off"
            exit 1
          }

      - name: Guardrail - split processing must never delete by content hash
        run: |
          if grep -n 'delete_many.*sha256_hash' backend/services/batch_po_splitter.py; then
            echo "::error::Destructive split replay detected: child hashes must be idempotent, never deleted"
            exit 1
          fi

      - name: Guardrail - retry cannot invoke legacy upload/link orchestration
        run: |
          if grep -n 'run_upload_and_link_workflow' backend/services/document_retry_service.py; then
            echo "::error::Retry path bypasses the parity delivery boundary"
            exit 1
          fi

      - name: Guardrail - AP and dynamic mail intake persist mailbox provenance
        run: |
          grep -q 'persist_mailbox_provenance' backend/services/email_polling_service.py || {
            echo "::error::Email intake does not persist mailbox provenance"
            exit 1
          }

      - name: Guardrail - Gamer Documents lookup binds BC entity and number
        run: |
          grep -q 'build_hub_document_link_query(bc_entity, bc_document_no)' backend/routers/gpi_integration.py || {
            echo "::error::Hub FactBox lookup is not bound to BC entity"
            exit 1
          }
          grep -q '_fetch_bc_document_links(bc_entity, bc_document_no)' backend/routers/gpi_integration.py || {
            echo "::error::BC documentLinks lookup is not bound to BC entity"
            exit 1
          }
          grep -q 'build_folder_match_query(bc_entity, bc_document_no)' backend/routers/gpi_integration.py || {
            echo "::error::BC-drop folder reuse is not bound to BC entity"
            exit 1
          }

      - name: Guardrail - BC FactBox uses deployed Hub proxy URL
        run: |
          grep -q "exit('http://4.204.41.190/api');" bc-extension/src/codeunit/GPIDocumentLinkMgt.Codeunit.al || {
            echo "::error::BC FactBox Hub URL does not match deployed nginx /api proxy"
            exit 1
          }
          if grep -n 'https://http://\|4\.204\.41\.190:8080' bc-extension/src/codeunit/GPIDocumentLinkMgt.Codeunit.al; then
            echo "::error::Malformed or internal Hub URL present in BC FactBox code"
            exit 1
          fi
