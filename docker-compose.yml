services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: gpi-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - gpi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gpi-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    # All secrets and environment-specific credentials live only in backend/.env
    # (or an equivalent runtime secret store). Never commit JWT/admin/API secrets
    # in compose. The application startup validator must fail closed if required
    # values are missing or insecure.
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=gpi_document_hub
    volumes:
      - uploads_data:/app/uploads
      - ./prod_reports:/app/prod_reports
    networks:
      - gpi-network
    expose:
      - "8001"
    # Host diagnostic access only. Do not expose the raw backend to the network;
    # Business Central and browsers must use the HTTPS reverse-proxy endpoint.
    ports:
      - "127.0.0.1:8005:8001"

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty means same-origin /api through nginx. An explicit external URL
        # may be injected at build time, but it must not be hard-coded here.
        - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-}
    container_name: gpi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Local origin consumed by the host TLS reverse proxy. External clients must
    # not connect directly over HTTP to port 8080.
    ports:
      - "127.0.0.1:8080:3000"
    networks:
      - gpi-network

volumes:
  mongodb_data:
    driver: local
  uploads_data:
    driver: local

networks:
  gpi-network:
    driver: bridge
